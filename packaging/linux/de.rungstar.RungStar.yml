# Flatpak manifest.
#
#   flatpak-builder --user --install --force-clean build packaging/linux/de.rungstar.RungStar.yml
#
# This is the delivery that matters for a Steam Deck. SteamOS has an immutable root filesystem,
# so nothing installs into /usr and a distribution package is not an option; Flatpak is how
# anything gets onto one and stays there across a system update.
app-id: de.rungstar.RungStar
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rungstar

# The full codec set. The base runtime ships a cut-down FFmpeg, and a song library is 88.8%
# AV1 video and 99.9% Ogg Vorbis audio — neither of which is in the cut-down build. This is
# also where a `ffmpeg` binary comes from when the runtime has one, which is what lets yt-dlp
# merge the separate streams YouTube serves above 360p. Downloads work without it, at worse
# video quality, and the screen says so.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '24.08'
    autodelete: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rungstar/cargo

finish-args:
  # Graphics and windowing. Wayland first, X11 as the fallback, which is also what a Gamescope
  # session offers.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Sound, both ways. Capture is the part that is easy to forget and the part without which
  # the game does nothing: PulseAudio's socket carries both, and PipeWire answers on it.
  - --socket=pulseaudio

  # Controllers. --device=dri is only the GPU; a gamepad is a different device node, and
  # without this the game is keyboard-only on a machine that has no keyboard.
  - --device=all

  # USDB, and the downloads.
  - --share=network

  # Songs. Deliberately not --filesystem=home: a karaoke game has no business reading
  # everything, and a folder somewhere else can be granted with `flatpak override`.
  - --filesystem=xdg-music
  - --filesystem=xdg-videos

modules:
  - name: rungstar
    buildsystem: simple
    build-options:
      env:
        # The vendored FFmpeg is a Windows build; on Linux the runtime's own libraries are
        # used, which is what the ffmpeg-sys build script expects to find by default.
        RUSTFLAGS: '-C link-arg=-s'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release -p rungstar-app
      - install -d /app/lib/ffmpeg
      - install -Dm755 target/release/rungstar /app/bin/rungstar
      - install -Dm755 target/release/rungstar-diagnostics /app/bin/rungstar-diagnostics
      # yt-dlp beside the game, so a fresh install on a Deck can download a song straight
      # away. /app is read-only, so this copy can never update itself — the game keeps a
      # newer one in ~/.var/app/de.rungstar.RungStar/data/tools and prefers that over this.
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 -t /app/share/rungstar/assets/themes assets/themes/*
      # Fonts and interface sounds. Both are committed, so an install line that silently did
      # nothing would hide a broken checkout rather than tolerate a missing extra.
      - install -Dm644 -t /app/share/rungstar/assets/fonts assets/fonts/*.ttf assets/fonts/OFL-*.txt
      - install -Dm644 -t /app/share/rungstar/assets/sounds assets/sounds/*.wav
      - install -Dm644 packaging/linux/de.rungstar.RungStar.desktop /app/share/applications/de.rungstar.RungStar.desktop
      - install -Dm644 packaging/linux/de.rungstar.RungStar.metainfo.xml /app/share/metainfo/de.rungstar.RungStar.metainfo.xml
      - install -Dm644 packaging/linux/rungstar.svg /app/share/icons/hicolor/scalable/apps/de.rungstar.RungStar.svg
      # GPL-3.0-or-later: shipping the binary without the licence beside it is a violation
      # rather than an oversight.
      - install -Dm644 LICENSE /app/share/licenses/rungstar/LICENSE
      - install -Dm644 NOTICE.md /app/share/licenses/rungstar/NOTICE.md
    sources:
      - type: dir
        path: ../..
      # Generated by `flatpak-cargo-generator.py Cargo.lock`, which turns the lock file into
      # sources Flatpak can fetch offline. Regenerate it whenever the lock file changes, or
      # the build will fetch nothing and fail on the first dependency.
      - cargo-sources.json
      # Generated by `packaging/linux/fetch-ytdlp.sh`. flatpak-builder builds with no network,
      # so a bundled binary has to be a declared source with a checksum rather than something
      # a build command downloads.
      - ytdlp-source.json
