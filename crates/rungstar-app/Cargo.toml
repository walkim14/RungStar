[package]
name = "rungstar-app"
description = "RungStar executables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rungstar"
path = "src/app.rs"

[[bin]]
name = "rungstar-diagnostics"
path = "src/diagnostics.rs"

[[bin]]
name = "rungstar-sing"
path = "src/sing.rs"

[dependencies]
rungstar-audio.workspace = true
rungstar-pitch.workspace = true
rungstar-platform.workspace = true
rungstar-song.workspace = true
rungstar-library.workspace = true
rungstar-ui.workspace = true
rungstar-editor.workspace = true
rungstar-party.workspace = true
rungstar-profile.workspace = true
ureq = { version = "3", features = ["cookies", "gzip"] }
rungstar-download.workspace = true
rungstar-usdb.workspace = true
rungstar-video.workspace = true
rungstar-score.workspace = true
sdl3 = { version = "0.18", features = ["unsafe_textures"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# The native folder chooser, for picking a song folder. `xdg-portal` rather than the default
# GTK3 backend: a Flatpak on a Steam Deck in Game Mode has no GTK and no desktop session, and
# the portal is the only thing that opens a file dialog there. It is also one fewer native
# dependency on the Linux build.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
