[package]
name = "rungstar-audio"
description = "Audio clock, mixing, capture routing and song decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# Every container and codec Symphonia ships, not a guess at which ones a library uses.
# A real 8,000 song library turned out to be 99.9% Ogg Vorbis, which the earlier list did not
# include at all — so almost nothing could be decoded, and the failure looked like "previews
# are unreliable" rather than "this format is not supported".
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }

[dev-dependencies]
tempfile = "3"
